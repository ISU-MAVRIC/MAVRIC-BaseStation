name: Prettier Formatter

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    # Skip if the commit was made by the prettier action itself
    if: github.event.head_commit.author.name != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install --no-save --legacy-peer-deps prettier prettier-plugin-svelte

      - name: Run Prettier
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --write "**/*.{js,ts,tsx,jsx,svelte,css,scss,md,json,html}" --ignore-path .prettierignore
          only_changed: false
          github_token: ${{ secrets.GITHUB_TOKEN }}