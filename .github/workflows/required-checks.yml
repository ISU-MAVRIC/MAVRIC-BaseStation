name: Required Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  enforce-lf:
    uses: ./.github/workflows/enforce-lf.yml

  electron-build:
    uses: ./.github/workflows/electron-build-launch-text.yml

  gatekeeper:
    name: CI Status Gatekeeper
    runs-on: ubuntu-latest
    needs: [enforce-lf, electron-build]
    steps:
      - name: Detect bot commit
        run: |
          if [ "${{ github.actor }}" = "github-actions[bot]" ]; then
            echo "Bot pushed this commit — skipping heavy checks."
          else
            echo "All required jobs passed."