name: Prettier Auto-fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prettier-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install --no-save --legacy-peer-deps prettier prettier-plugin-svelte

      - name: Run Prettier and commit changes
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --write "**/*.{js,ts,tsx,jsx,svelte,css,scss,md,json,html}" --ignore-path .prettierignore
          commit_message: 'style: apply prettier formatting'
